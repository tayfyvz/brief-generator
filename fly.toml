# Fly.io deployment config. Deploy with:
#   fly launch --no-deploy   (first time; attach a Postgres: fly postgres create)
#   fly secrets set DATABASE_URL=... ANTHROPIC_API_KEY=... TAVILY_API_KEY=... \
#     EXA_API_KEY=... FIRECRAWL_API_KEY=... GOOGLE_PLACES_API_KEY=...
#   fly deploy
app = "brief-generator"
primary_region = "ewr"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  # Research runs live in-process; never scale to zero mid-run.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
